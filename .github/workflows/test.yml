name: Node tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: node --check public/app.js
      - run: node --check server.mjs
      - run: node --check context/assemble.mjs
      - run: node --check context/backend.mjs
      - run: node --check memory/store.mjs
      - run: node --check memory/semantic.mjs
      - run: node --check character/world-bridge.mjs
      - run: node --check character/relationship-bridge.mjs
      - run: node --check eval/local-model.mjs
      - run: node --check eval/local-semantic.mjs
      - run: npm test
      - run: npm run eval:memory
      - run: npm run eval:semantic
      - run: npm run eval:scale -- --ci
      - run: npm run eval:scale -- --ci --primary
      - run: npm run eval:scale -- --ci --journal
      - run: node --check scripts/browser-smoke.mjs
      - name: Headless Chrome UI flows (Node 22)
        if: matrix.node-version == '22'
        run: npm run test:browser
      - name: Save UI review screenshots
        if: matrix.node-version == '22' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-review-screenshots
          path: artifacts/ui-review/*.png
          if-no-files-found: ignore

  windows-storage:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Windows SQLite, world isolation and backup/recovery regression tests
        run: npm test
      - name: Windows large-story storage baseline
        run: npm run eval:scale -- --ci
      - name: Windows normalized-primary storage baseline
        run: npm run eval:scale -- --ci --primary
      - name: Windows append-journal storage baseline
        run: npm run eval:scale -- --ci --journal
