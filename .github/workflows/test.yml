name: Node tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: node --check public/app.js
      - run: node --check server.mjs
      - run: node --check context/assemble.mjs
      - run: node --check context/backend.mjs
      - run: node --check memory/store.mjs
      - run: node --check memory/semantic.mjs
      - run: node --check character/world-bridge.mjs
      - run: npm test
      - run: npm run eval:memory
